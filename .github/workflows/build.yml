name: Build LiteWave

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: litewave-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          modules: "qtwebengine qtwebchannel qtpositioning"
          cache: true
      - name: Build and package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw "Configure failed" }
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }
          New-Item -ItemType Directory -Force package
          Copy-Item build/Release/LiteWave.exe package/
          windeployqt --release --no-translations package/LiteWave.exe
          if ($LASTEXITCODE -ne 0) { throw "Qt deployment failed" }
          Copy-Item README.md,THIRD_PARTY_NOTICES.md package/
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/LiteWave.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (!(Test-Path dist/LiteWave-Setup-Windows-x64.exe)) { throw "Installer missing" }
          Compress-Archive -Path package/* -DestinationPath LiteWave-Windows-x64-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LiteWave-Windows-x64
          if-no-files-found: error
          path: |
            dist/LiteWave-Setup-Windows-x64.exe
            LiteWave-Windows-x64-portable.zip

  linux:
    name: Linux package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: linux_gcc_64
          modules: "qtwebengine qtwebchannel qtpositioning"
          cache: true
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ xvfb xauth
      - name: Build and bundle
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build -j2
          QTWEBENGINE_CHROMIUM_FLAGS="--disable-gpu" xvfb-run -a ctest --test-dir build --output-on-failure

          qt_prefix="${QT_ROOT_DIR:?QT_ROOT_DIR was not set by Install Qt}"
          test -x "${qt_prefix}/libexec/QtWebEngineProcess"

          mkdir -p package/LiteWave/bin package/LiteWave/lib package/LiteWave/libexec
          install -Dm755 build/LiteWave package/LiteWave/bin/LiteWave
          install -Dm755 packaging/linux/LiteWave package/LiteWave/LiteWave
          install -Dm644 packaging/LiteWave.desktop package/LiteWave/LiteWave.desktop
          install -Dm644 assets/litewave.svg package/LiteWave/litewave.svg
          install -Dm644 README.md package/LiteWave/README.md
          install -Dm644 THIRD_PARTY_NOTICES.md package/LiteWave/THIRD_PARTY_NOTICES.md

          cp -a "${qt_prefix}"/lib/libQt6*.so* package/LiteWave/lib/
          cp -a "${qt_prefix}"/plugins package/LiteWave/
          cp -a "${qt_prefix}"/resources package/LiteWave/
          cp -a "${qt_prefix}"/translations package/LiteWave/
          install -Dm755 "${qt_prefix}/libexec/QtWebEngineProcess" \
            package/LiteWave/libexec/QtWebEngineProcess

          tar -czf LiteWave-Linux-x64.tar.gz -C package LiteWave
      - uses: actions/upload-artifact@v4
        with:
          name: LiteWave-Linux-x64
          if-no-files-found: error
          path: LiteWave-Linux-x64.tar.gz

  release:
    name: Publish easy downloads
    needs: [windows, linux]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: LiteWave-Windows-x64
          path: release/windows
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: LiteWave-Linux-x64
          path: release/linux
      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: LiteWave Latest (v1.0.0)
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          body: |
            LiteWave v1.0.0 built from commit ${{ github.sha }}.
            No ad blocking, content filtering, cosmetic scripts, or popup
            filtering is included. This build prioritizes broad website
            compatibility, including embedded video players.
            Windows: download the Setup EXE and run it. Linux archive is built on Ubuntu 24.04;
            Fedora users should follow the source-build instructions in README.
          files: |
            release/windows/dist/LiteWave-Setup-Windows-x64.exe
            release/windows/LiteWave-Windows-x64-portable.zip
            release/linux/LiteWave-Linux-x64.tar.gz
