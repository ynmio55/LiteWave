name: Build LiteWave

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: litewave-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          modules: "qtwebengine qtwebchannel qtpositioning"
          cache: true
      - name: Build and package
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release
          New-Item -ItemType Directory -Force package
          Copy-Item build/Release/LiteWave.exe package/
          windeployqt --release --no-translations package/LiteWave.exe
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/LiteWave.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (!(Test-Path dist/LiteWave-Setup-Windows-x64.exe)) { throw "Installer missing" }
          Compress-Archive -Path package/* -DestinationPath LiteWave-Windows-x64-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LiteWave-Windows-x64
          path: |
            dist/LiteWave-Setup-Windows-x64.exe
            LiteWave-Windows-x64-portable.zip
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LiteWave-Setup-Windows-x64.exe
            LiteWave-Windows-x64-portable.zip

  linux:
    name: Linux package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ qt6-base-dev qt6-webengine-dev
      - name: Build package
        run: |
          cmake -S . -B build
          cmake --build build -j2
          mkdir -p package/LiteWave
          cp build/LiteWave package/LiteWave/
          cp packaging/LiteWave.desktop package/LiteWave/
          cp assets/litewave.svg package/LiteWave/
          cp README.md package/LiteWave/
          tar -czf LiteWave-Linux-x64.tar.gz -C package LiteWave
      - uses: actions/upload-artifact@v4
        with:
          name: LiteWave-Linux-x64
          path: LiteWave-Linux-x64.tar.gz
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LiteWave-Linux-x64.tar.gz

  release:
    name: Publish easy downloads
    needs: [windows, linux]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: LiteWave-Windows-x64
          path: release/windows
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: LiteWave-Linux-x64
          path: release/linux
      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LiteWave latest
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          body: |
            Compatibility update built from commit ${{ github.sha }}.
            Build and packaging checks passed; not a certification of all-site or DRM playback.
            Windows: download the Setup EXE and run it. Linux archive is built on Ubuntu 24.04;
            Fedora users should follow the source-build instructions in README.
            Use the Video capability button to check the codecs available on your installation.
          files: |
            release/windows/dist/LiteWave-Setup-Windows-x64.exe
            release/windows/LiteWave-Windows-x64-portable.zip
            release/linux/LiteWave-Linux-x64.tar.gz
